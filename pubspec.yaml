name: alarm_study
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_dotenv: ^5.1.0
  file_picker: ^8.0.0
  google_sign_in: ^7.2.0          # 구글 로그인
  kakao_flutter_sdk_user: ^1.9.7  # 카카오 로그인 (User API)
  flutter_secure_storage: ^9.2.2  # 로그인 토큰 안전하게 저장
  path_provider: ^2.1.4           # AI가 생성한 노래(오디오)를 로컬 파일로 저장
  audioplayers: ^6.1.0            # 알람음/생성된 노래 미리듣기 재생
  alarm: ^5.5.0                   # 실제 기기 알람 예약 (앱이 꺼져있어도 설정 시간에 울림)
  permission_handler: ^11.3.1     # Android 12+ 정확한 알람(SCHEDULE_EXACT_ALARM) 권한 요청
  camera: ^0.11.0                 # 카메라 프리뷰와 실시간 이미지 입력
  google_mlkit_commons: ^0.7.1    # ML Kit 공통 유틸리티
  google_mlkit_face_detection: ^0.11.0  # 얼굴 인식(눈 깜빡임)
  google_mlkit_pose_detection: ^0.11.0  # 포즈 인식(스쿼트/걸음)


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/sounds/

